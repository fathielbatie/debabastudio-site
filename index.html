<style>
  :root { --bg: #0b0e24; --fg: #e9ebff; --muted: #a8aed8; --accent: #ff9a3c; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 17px/1.6 system-ui, sans-serif; text-align: center; }
  main { padding: 40px 16px; max-width: 560px; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .dots i { width: 22px; height: 22px; border-radius: 6px; display: block; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  h2 { font-size: 22px; margin: 36px 0 4px; }
</style>
